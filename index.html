<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#bccfcc">
<title>true form</title>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #bccfcc; overscroll-behavior: none; }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none;
    touch-action: none; cursor: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #dev {
    position: fixed; left: 10px; top: 10px; z-index: 5; width: 218px; padding: 10px 12px;
    background: rgba(32, 29, 25, .9); color: #e6e0d2; border-radius: 6px;
    font: 12px/1.45 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.3);
  }
  #dev[hidden] { display: none; }
  #dev label { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 2px 8px; margin: 5px 0; }
  #dev label span { grid-column: 1 / 3; opacity: .75; }
  #dev input[type=range] { width: 100%; margin: 0; }
  #dev output { text-align: right; font-variant-numeric: tabular-nums; }
  #dev .row { display: flex; gap: 6px; margin-top: 8px; }
  #dev button { flex: 1; font: inherit; padding: 4px 6px; background: #4a443b; color: #eee; border: 0; border-radius: 4px; cursor: pointer; }
  #dev button:hover { background: #5f574b; }
  #dev .keys { margin-top: 8px; opacity: .55; font-size: 11px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="dev" hidden>
  <label><span>brush size</span><input id="d_brush" type="range" min="20" max="110" step="1"><output id="o_brush"></output></label>
  <label><span>auto-complete at reveal %</span><input id="d_reveal" type="range" min="30" max="100" step="1"><output id="o_reveal"></output></label>
  <label><span>number of bones (restarts)</span><input id="d_bones" type="range" min="8" max="12" step="1"><output id="o_bones"></output></label>
  <label><span>animation fps (stop-motion)</span><input id="d_fps" type="range" min="4" max="30" step="1"><output id="o_fps"></output></label>
  <div class="row"><button id="d_restart">restart</button><button id="d_skip">skip dig</button></div>
  <div class="keys">D panel · R restart</div>
</div>

<script>

      if (idle && idle.ruffle <= 0 && Math.random() < 0.08) idle.ruffle = 0.4;
    }
    brush.last = cur;
  }
}
canvas.addEventListener('pointerdown', e => { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} onPointer(e, true); e.preventDefault(); });
canvas.addEventListener('pointermove', e => { onPointer(e, false); });
const up = e => { brush.down = false; brush.last = null; if (e.pointerType === 'touch') brush.inside = false; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') { brush.inside = false; brush.last = null; } });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);

const dev = document.getElementById('dev');
const bind = (id, key, scale, fmt, restartOnChange) => {
  const inp = document.getElementById('d_' + id), out = document.getElementById('o_' + id);
  inp.value = CONFIG[key] * scale; out.textContent = fmt(CONFIG[key]);
  inp.addEventListener('input', () => { CONFIG[key] = +inp.value / scale; out.textContent = fmt(CONFIG[key]); if (restartOnChange) restart(); });
};
bind('brush', 'BRUSH_SIZE', 1, v => v | 0); bind('reveal', 'REVEAL_AUTOCOMPLETE', 100, v => Math.round(v * 100) + '%'); bind('bones', 'NUM_BONES', 1, v => v | 0, true); bind('fps', 'FPS', 1, v => v | 0);
document.getElementById('d_restart').addEventListener('click', () => restart());
document.getElementById('d_skip').addEventListener('click', () => skipDig());
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd') dev.hidden = !dev.hidden;
  else if (k === 'r') restart();
});

function skipDig() { if (phase !== 'dig') return; for (const b of bones) if (!b.found) { b.found = true; b.age = 1; } setPhase('blow'); }

function restart() {
  Z = 1; applyView(); particles = []; warm = 0; resetPose(); idle = null; iconT = -1; autoC = null; T = 0;
  brush.userMoved = false; brush.hint = true; brush.last = null; brush.p0 = null; canvas.style.cursor = 'none';
  pickSpecies(); setupDig(); setupReveal(); setPhase('dig');
}

function frame(ts) {
  if (document.hidden) { lastTick = -1; requestAnimationFrame(frame); return; }
  const tick = Math.floor(ts / 1000 * CONFIG.FPS);
  if (lastTick < 0) lastTick = tick;
  if (tick !== lastTick) { const dt = Math.min(0.25, (tick - lastTick) / CONFIG.FPS); lastTick = tick; if (phase !== 'boot' && !DEBUG.freeze) step(dt); }
  render();
  requestAnimationFrame(frame);
}

async function boot() {
  resize();
  await loadTextures();
  bakeAll();
  pickSpecies(); setupDig(); setupReveal(); setPhase('dig');
  requestAnimationFrame(frame);
}
boot();

const DEBUG = { hideSand: false, freeze: false };
window.DIG = { useSpecies(id) { forcedSpecies = id; restart(); }, get species() { return SP.id; }, behave(st) { if (idle) enterBehavior(idle, st); }, pose, DEBUG, setPT(v) { pt = v; }, stepBy(dt) { step(dt); }, bench(n) { const t = performance.now(); for (let i = 0; i < n; i++) render(); ctx.getImageData(0, 0, 1, 1); return +((performance.now() - t) / n).toFixed(2); }, CONFIG, TUNE, PALETTE, get phase() { return phase; }, get progress() { return progress; }, bones: () => bones, skipDig, restart, overrideSprite, SPRITES, setPhase,
  revealAll() { if (phase === 'prompt' || phase === 'reveal') { autoC = { x: 800, y: 470, r: 0 }; setPhase('autoc'); } } };
})();
</script>
